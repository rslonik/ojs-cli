name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: phar, curl, zip
          ini-values: phar.readonly=0
          tools: composer:v2, box

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Stamp version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          sed -i "s/@package_version@/${version}/" php/ojs-cli.php
          if grep -q '@package_version@' php/ojs-cli.php; then
            echo "::error::version placeholder not found in php/ojs-cli.php"
            exit 1
          fi
          echo "Stamped version ${version}"

      - name: Build PHAR
        run: box compile

      - name: Verify PHAR
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          php ojs.phar --version
          if ! php ojs.phar --version | grep -qF "${version}"; then
            echo "::error::PHAR does not report version ${version}"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ojs.phar
          tag_name: ${{ inputs.version }}
          generate_release_notes: true
